; Copy this file to config.ini and fill it in. Never share config.ini: it holds your Exotel password.
[exotel]
; From Exotel dashboard > Settings > API Settings
sid =
api_key =
api_token =
; api.in.exotel.com for the Mumbai cluster (most Indian accounts), api.exotel.com for Singapore
subdomain = api.in.exotel.com
; Your 140-series promotional number from Exotel (required by TRAI for recorded promotional calls)
caller_id =
; The call flow that plays your recording. Exotel dashboard > App Bazaar > My Apps > the app's ID
flow_app_id =

seconds_between_calls = 3
max_calls_per_run = 200
ring_timeout = 30
; Only used for the cost estimate. Put your real per-call rate from Exotel here.
cost_per_call_rupees = 1
